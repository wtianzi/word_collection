<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>阅读标记 · Read &amp; Mark</title>
  <style>
    :root {
      --bg:#0f172a; --card:#1e293b; --card2:#334155; --text:#e2e8f0;
      --muted:#94a3b8; --accent:#38bdf8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    }
    header {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      border-bottom:1px solid var(--card2); position:sticky; top:0; background:var(--bg); z-index:5;
    }
    header a.back { color:var(--muted); text-decoration:none; font-size:22px; }
    header h1 { font-size:17px; margin:0; font-weight:600; }
    header .spacer { flex:1; }
    .upload {
      max-width:760px; margin:26px auto; padding:0 18px; text-align:center;
    }
    .drop {
      border:2px dashed var(--card2); border-radius:18px; padding:36px 20px;
      background:var(--card); cursor:pointer; transition:border-color .15s;
    }
    .drop:hover { border-color:var(--accent); }
    .drop .icon { font-size:40px; }
    .drop p { color:var(--muted); margin:10px 0 0; font-size:14px; }
    .opts { margin:16px 0; color:var(--muted); font-size:14px; }
    select { background:var(--card); color:var(--text); border:1px solid var(--card2);
      border-radius:10px; padding:7px 10px; font-size:14px; }
    .status { color:var(--muted); font-size:14px; margin-top:12px; min-height:20px; }

    .library { margin-top:26px; text-align:left; }
    .lib-head { display:flex; align-items:center; justify-content:space-between;
      color:var(--muted); font-size:14px; margin-bottom:10px; }
    .lib-head button { background:var(--card); color:var(--muted); border:1px solid var(--card2);
      border-radius:8px; padding:4px 9px; font-size:13px; cursor:pointer; }
    .lib-list { display:flex; flex-direction:column; gap:8px; }
    .book { display:flex; align-items:center; gap:12px; background:var(--card);
      border:1px solid var(--card2); border-radius:12px; padding:12px 14px;
      cursor:pointer; transition:border-color .15s, background .15s; }
    .book:hover { border-color:var(--accent); background:var(--card2); }
    .book .bi { font-size:22px; }
    .book .info { flex:1; min-width:0; }
    .book .nm { font-size:15px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .book .sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .book .prog { font-size:12px; color:var(--accent); border:1px solid var(--card2);
      border-radius:999px; padding:2px 9px; white-space:nowrap; }
    .book .go { color:var(--accent); font-size:18px; }
    .book .delete-btn { background:transparent; color:var(--muted); border:1px solid var(--card2);
      border-radius:8px; padding:5px 8px; cursor:pointer; }
    .book .delete-btn:hover { color:#fca5a5; border-color:#ef4444; }
    .lib-empty { color:var(--muted); font-size:13px; padding:6px 2px; }

    .reader { max-width:760px; margin:0 auto; padding:10px 18px 140px; display:none; }
    .reader .meta { color:var(--muted); font-size:13px; margin:6px 0 16px;
      display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
    .reader .meta button {
      background:var(--card); color:var(--text); border:1px solid var(--card2);
      border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
    }
    #content { white-space:pre-wrap; line-height:2.0; font-size:19px;
      font-family:Georgia,"Songti SC",serif; }
    #content .w { border-radius:4px; padding:0 1px; cursor:pointer; }
    #content .w.hl { color:#0b1120; }
    #content .w.done { outline:2px solid #ef4444; outline-offset:1px; }

    #panel {
      position:fixed; left:0; right:0; top:0; background:#0b1120;
      border-bottom:1px solid var(--card2); padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
      transform:translateY(-115%); transition:transform .2s; z-index:20;
    }
    #panel.show { transform:translateY(0); }
    #panel .panel-head { display:flex; align-items:flex-start; gap:12px; }
    #panel .titles { flex:1; min-width:0; }
    #panel .hw { font-size:22px; font-weight:700; cursor:pointer; }
    #panel .hw:hover { color:var(--accent); }
    #panel .ph { color:var(--accent); margin-left:8px; font-size:16px; }
    #panel .speak {
      margin-left:10px; background:transparent; border:1px solid var(--card2);
      color:var(--muted); border-radius:8px; padding:2px 9px; font-size:15px;
      cursor:pointer; vertical-align:2px; transition:border-color .15s,color .15s;
    }
    #panel .speak:hover { border-color:var(--accent); color:var(--accent); }
    #panel .speak:active { transform:scale(.94); }
    #panel .fam { margin-top:6px; font-size:13px; color:var(--muted); }
    #panel .tr { margin-top:8px; white-space:pre-line; font-size:16px; line-height:1.6; }
    #panel .row { display:flex; align-items:center; gap:12px; }
    #panel .rank {
      flex:1; background:var(--card); color:var(--text); border:1px solid var(--card2);
      border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer;
      transition:border-color .15s,color .15s,opacity .15s;
    }
    #panel .rank.down:hover:not(:disabled) { border-color:#ef4444; color:#ef4444; }
    #panel .rank.up:hover:not(:disabled)   { border-color:#22c55e; color:#22c55e; }
    #panel .rank:disabled { opacity:.4; cursor:default; }

    #panel .more-actions {
      display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px;
      padding-top:14px; border-top:1px solid var(--card2);
    }
    #panel .stars { font-size:24px; letter-spacing:3px; white-space:nowrap; }
    #panel .stars .star { cursor:pointer; color:#475569; }
    #panel .stars .star.on { color:#fbbf24; }
    #panel .ignore-btn, #panel .master-btn {
      background:transparent; border:1px solid var(--card2); color:var(--muted);
      border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
      transition:border-color .15s,color .15s;
    }
    #panel .master-btn { margin-left:auto; }
    #panel .master-btn:hover { border-color:#22c55e; color:#22c55e; }
    #panel .ignore-btn:hover { border-color:#ef4444; color:#ef4444; }
    .toast {
      position:fixed; left:50%; bottom:150px; transform:translateX(-50%);
      background:#0b1120; border:1px solid var(--card2); color:var(--text);
      padding:8px 16px; border-radius:999px; font-size:14px; opacity:0;
      transition:opacity .25s; pointer-events:none; z-index:30;
    }
    .toast.show { opacity:1; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .legend i { width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }

    .book .wl-btn {
      background:var(--card2); color:var(--text); border:1px solid var(--card2);
      border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; white-space:nowrap;
      transition:border-color .15s, color .15s;
    }
    .book .wl-btn:hover { border-color:var(--accent); color:var(--accent); }

    .wordlist { max-width:760px; margin:0 auto; padding:10px 18px 80px; display:none; }
    .wl-head { display:flex; align-items:center; gap:12px; padding:6px 0 14px; }
    .wl-back {
      background:var(--card); color:var(--text); border:1px solid var(--card2);
      border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
    }
    .wl-title { min-width:0; }
    .wl-title #wlName { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wl-sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .wl-actions-toggle {
      margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted);
      font-size:13px; cursor:pointer; user-select:none; white-space:nowrap;
    }
    .wl-switch { position:relative; width:40px; height:22px; flex:none; }
    .wl-switch input { opacity:0; width:0; height:0; }
    .wl-switch .track {
      position:absolute; inset:0; background:var(--card2); border-radius:999px;
      transition:background .15s;
    }
    .wl-switch .track::before {
      content:""; position:absolute; width:16px; height:16px; left:3px; top:3px;
      background:var(--text); border-radius:50%; transition:transform .15s;
    }
    .wl-switch input:checked + .track { background:var(--accent); }
    .wl-switch input:checked + .track::before { transform:translateX(18px); }
    .wl-group { margin-top:18px; }
    .wl-group-head {
      display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600;
      margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--card2);
    }
    .wl-group-head .dot { width:11px; height:11px; border-radius:3px; display:inline-block; }
    .wl-group-head .cnt { color:var(--muted); font-weight:400; font-size:13px; }
    .wl-item {
      display:flex; align-items:center; gap:10px; padding:8px 2px;
      border-bottom:1px solid rgba(148,163,184,.12);
    }
    .wl-item .wl-w { font-size:16px; font-weight:600; color:var(--text); }
    .wl-item .wl-ph { color:var(--accent); font-size:13px; }
    .wl-item .wl-tr { color:var(--muted); font-size:13px; flex:1; min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wl-stars { flex:none; font-size:20px; letter-spacing:2px; white-space:nowrap; }
    .wl-stars .star { cursor:pointer; color:#475569; }
    .wl-stars .star.on { color:#fbbf24; }
    .wl-speak, .wl-ignore, .wl-master {
      flex:none; display:none; background:transparent; border:1px solid var(--card2);
      color:var(--muted); border-radius:8px; padding:3px 8px; font-size:13px;
      cursor:pointer; transition:border-color .15s,color .15s;
    }
    .wordlist.show-actions .wl-speak { display:inline-block; }
    .wordlist.show-actions .wl-ignore { display:inline-block; }
    .wordlist.show-actions .wl-master { display:inline-block; }
    .wl-speak:hover { border-color:var(--accent); color:var(--accent); }
    .wl-ignore:hover { border-color:#ef4444; color:#ef4444; }
    .wl-master:hover { border-color:#22c55e; color:#22c55e; }
    .wl-empty { color:var(--muted); font-size:13px; padding:20px 2px; }
    @media (max-width:680px) {
      .wl-head { flex-wrap:wrap; }
      .wl-actions-toggle { margin-left:0; }
      .wl-item { flex-wrap:wrap; }
      .wl-item .wl-tr { order:2; flex-basis:100%; }
      .wl-stars { margin-left:auto; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/">←</a>
    <h1>阅读标记 · Read &amp; Mark</h1>
    <div class="spacer"></div>
  </header>

  <div class="upload" id="upload">
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <div class="icon">📖</div>
      <div>点击上传文章 / 书籍</div>
      <p>支持 .txt .md .html .pdf .epub</p>
    </div>
    <input type="file" id="file" accept=".txt,.md,.markdown,.html,.htm,.pdf,.epub" style="display:none" />
    <div class="opts">
      高亮范围：从
      <select id="minFam" onchange="syncFamRange('min')">
        <option value="1" selected>陌生</option>
        <option value="2">学习中</option>
        <option value="3">熟悉</option>
        <option value="4">熟练</option>
        <option value="5">掌握</option>
      </select>
      到
      <select id="maxFam" onchange="syncFamRange('max')">
        <option value="1">陌生</option>
        <option value="2" selected>学习中</option>
        <option value="3">熟悉</option>
        <option value="4">熟练</option>
        <option value="5">掌握</option>
      </select>
    </div>
    <div class="status" id="status"></div>

    <div class="library" id="library">
      <div class="lib-head">
        <span>📚 已上传的书籍 · Uploaded books</span>
        <button id="libRefresh" onclick="loadLibrary()">↻</button>
      </div>
      <div class="lib-list" id="libList"></div>
    </div>
  </div>

  <div class="reader" id="reader">
    <div class="meta">
      <span id="fileName"></span>
      <span id="counts"></span>
      <button onclick="reset()">↻ 换一篇</button>
      <span class="legend">
        <span><i style="background:#ef4444"></i>陌生</span>
        <span><i style="background:#f59e0b"></i>学习中</span>
        <span><i style="background:#a855f7"></i>生词(词表外)</span>
      </span>
    </div>
    <div id="content"></div>
  </div>

  <div class="wordlist" id="wordlist">
    <div class="wl-head">
      <button class="wl-back" onclick="closeWordList()">← 返回</button>
      <div class="wl-title">
        <div id="wlName"></div>
        <div id="wlCount" class="wl-sub"></div>
      </div>
      <label class="wl-actions-toggle" title="显示朗读 / 掌握 / 忽略按钮">
        <span>更多操作</span>
        <span class="wl-switch">
          <input type="checkbox" id="wlActionsSwitch" onchange="toggleWordListActions(this.checked)" />
          <span class="track"></span>
        </span>
      </label>
    </div>
    <div id="wlBody"></div>
  </div>

  <div id="panel">
    <div class="panel-head">
      <div class="titles">
        <div>
          <span class="hw"></span><span class="ph"></span>
          <button class="speak" id="speakBtn" title="朗读单词">🔊</button>
        </div>
        <div class="fam"></div>
      </div>
    </div>
    <div class="tr"></div>
    <div class="row" style="margin-top:12px">
      <button class="rank down" id="rankDown">↓ 调低熟悉度</button>
      <button class="rank up" id="rankUp">↑ 调高熟悉度</button>
    </div>
    <div class="more-actions">
      <span class="stars" id="stars">
        <span class="star" data-n="1">★</span><span class="star" data-n="2">★</span><span class="star" data-n="3">★</span><span class="star" data-n="4">★</span><span class="star" data-n="5">★</span>
      </span>
      <button class="master-btn" id="masterBtn" title="标记为已掌握（移出学习流程）">✓ 掌握</button>
      <button class="ignore-btn" id="ignoreBtn" title="忽略此词（人名 / 专有名词）">🚫 忽略</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const FAM_LABELS = {1:'陌生 Unfamiliar',2:'学习中 Learning',3:'熟悉 Familiar',4:'熟练 Proficient',5:'掌握 Mastered'};
const FAM_COLOR = {1:'#ef4444',2:'#f59e0b',3:'#eab308',4:'#84cc16',5:'#22c55e'};
const UNKNOWN_COLOR = '#a855f7';
let activeEl = null;
let readMinFam = 1;
let readMaxFam = 2;
let currentBook = null;
let currentWordList = null;

// Highlight range controls: keep 从(min) <= 到(max) and read the current pair.
function readFamRange() {
  let mn = parseInt(document.getElementById('minFam').value, 10) || 1;
  let mx = parseInt(document.getElementById('maxFam').value, 10) || mn;
  if (mn > mx) { const t = mn; mn = mx; mx = t; }
  return { min: mn, max: mx };
}

function syncFamRange(which) {
  const minEl = document.getElementById('minFam');
  const maxEl = document.getElementById('maxFam');
  const mn = parseInt(minEl.value, 10);
  const mx = parseInt(maxEl.value, 10);
  if (mn > mx) {
    if (which === 'min') maxEl.value = String(mn);
    else minEl.value = String(mx);
  }
}

// --- Reading position memory (stored on the server) ------------------------
let pendingProgress = null;   // latest {percent, scroll} not yet sent
let progressFlushTimer = null;

function computeProgress() {
  const y = Math.round(window.scrollY);
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const pct = scrollable > 0 ? Math.round((y / scrollable) * 100) : 0;
  return { scroll: y, percent: Math.min(100, Math.max(0, pct)) };
}

function queueProgressSave() {
  if (!currentBook) return;
  pendingProgress = computeProgress();
  if (progressFlushTimer) return;
  progressFlushTimer = setTimeout(() => flushProgress(false), 800);
}

function flushProgress(useBeacon) {
  if (progressFlushTimer) { clearTimeout(progressFlushTimer); progressFlushTimer = null; }
  if (!currentBook || !pendingProgress) return;
  const payload = JSON.stringify({
    name: currentBook, percent: pendingProgress.percent, scroll: pendingProgress.scroll,
  });
  pendingProgress = null;
  if (useBeacon && navigator.sendBeacon) {
    navigator.sendBeacon('/api/reading/progress',
      new Blob([payload], { type: 'application/json' }));
    return;
  }
  fetch('/api/reading/progress', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: payload, keepalive: true,
  }).catch(() => { /* best-effort */ });
}

let scrollSaveScheduled = false;
window.addEventListener('scroll', () => {
  if (scrollSaveScheduled) return;
  scrollSaveScheduled = true;
  requestAnimationFrame(() => { scrollSaveScheduled = false; queueProgressSave(); });
}, { passive: true });
window.addEventListener('beforeunload', () => { queueProgressSave(); flushProgress(true); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { queueProgressSave(); flushProgress(true); }
});

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function fmtDate(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}

async function loadLibrary() {
  const list = document.getElementById('libList');
  list.innerHTML = '<div class="lib-empty">加载中…</div>';
  try {
    const res = await fetch('/api/uploads');
    const data = await res.json();
    const files = data.files || [];
    if (!files.length) {
      list.innerHTML = '<div class="lib-empty">还没有上传过书籍。上传后会显示在这里，方便下次直接打开。</div>';
      return;
    }
    list.innerHTML = '';
    files.forEach(f => {
      const el = document.createElement('div');
      el.className = 'book';
      const pct = (typeof f.percent === 'number') ? f.percent : null;
      const badge = pct === null
        ? ''
        : `<span class="prog">${pct >= 100 ? '已读完' : pct + '%'}</span>`;
      el.innerHTML =
        `<span class="bi">📗</span>` +
        `<div class="info"><div class="nm"></div>` +
        `<div class="sub">${fmtSize(f.size)} · ${fmtDate(f.modified)}</div></div>` +
        badge +
        `<button class="wl-btn" title="词表">📋 词表</button>` +
        `<button class="delete-btn" title="删除书籍">🗑 删除</button>` +
        `<span class="go">→</span>`;
      el.querySelector('.nm').textContent = f.name;
      el.addEventListener('click', () => openBook(f.name));
      el.querySelector('.wl-btn').addEventListener('click', (ev) => {
        ev.stopPropagation();
        openWordList(f.name);
      });
      el.querySelector('.delete-btn').addEventListener('click', (ev) => {
        ev.stopPropagation();
        deleteBook(f.name, el);
      });
      list.appendChild(el);
    });
  } catch (e) {
    list.innerHTML = '<div class="lib-empty">加载失败：' + e.message + '</div>';
  }
}

async function deleteBook(name, row) {
  if (!confirm(`确定删除《${name}》吗？\n书籍文件和阅读进度都会被删除。`)) return;
  const button = row.querySelector('.delete-btn');
  button.disabled = true;
  try {
    const res = await fetch('/api/uploads?name=' + encodeURIComponent(name), { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    const result = await res.json();
    row.remove();
    document.getElementById('status').textContent =
      `已删除 ${name}，并从全局词表移除 ${result.removed_words || 0} 个未学习单词。`;
    if (!document.querySelector('#libList .book')) {
      document.getElementById('libList').innerHTML = '<div class="lib-empty">还没有上传过书籍。</div>';
    }
  } catch (e) {
    button.disabled = false;
    document.getElementById('status').textContent = '删除失败：' + e.message;
  }
}

async function openBook(name) {
  const status = document.getElementById('status');
  status.textContent = '正在打开 ' + name + ' …';
  try {
    const range = readFamRange();
    const res = await fetch('/api/reading/open', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, max_familiarity: range.max, min_familiarity: range.min })
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    showReader(await res.json());
    status.textContent = '';
  } catch (e) {
    status.textContent = '出错了：' + e.message;
  }
}

async function openWebPage(url) {
  const status = document.getElementById('status');
  status.textContent = '正在提取网页正文…';
  try {
    const range = readFamRange();
    const res = await fetch('/api/reading/webpage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        url,
        max_familiarity: range.max,
        min_familiarity: range.min,
      })
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    showReader(await res.json());
    status.textContent = '';
    history.replaceState(null, '', '/read');
  } catch (e) {
    status.textContent = '网页读取失败：' + e.message;
  }
}

const FAM_ORDER = [1, 2, 3, 4, 5];

async function openWordList(name) {
  const status = document.getElementById('status');
  status.textContent = '正在生成 ' + name + ' 的词表 …';
  try {
    const res = await fetch('/api/reading/wordlist', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name })
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    renderWordList(await res.json());
    status.textContent = '';
  } catch (e) {
    status.textContent = '出错了：' + e.message;
  }
}

function renderWordList(data) {
  document.getElementById('upload').style.display = 'none';
  document.getElementById('reader').style.display = 'none';
  document.getElementById('wordlist').style.display = 'block';
  currentBook = null;  // viewing a glossary, not reading: don't record scroll
  currentWordList = {
    name: data.name,
    words: (data.words || []).map(word => ({ ...word })),
  };
  renderWordListBody();
  window.scrollTo(0, 0);
}

function renderWordListBody() {
  if (!currentWordList) return;
  const wordsInList = currentWordList.words;
  document.getElementById('wlName').textContent = currentWordList.name;
  document.getElementById('wlCount').textContent =
    `共 ${wordsInList.length.toLocaleString()} 个单词 · 按熟悉度分组`;

  const groups = {1:[],2:[],3:[],4:[],5:[]};
  wordsInList.forEach(w => {
    const fam = FAM_ORDER.includes(w.familiarity) ? w.familiarity : 1;
    groups[fam].push(w);
  });

  const body = document.getElementById('wlBody');
  body.innerHTML = '';
  let any = false;
  FAM_ORDER.forEach(fam => {
    const words = groups[fam];
    if (!words.length) return;
    any = true;
    const group = document.createElement('div');
    group.className = 'wl-group';
    const head = document.createElement('div');
    head.className = 'wl-group-head';
    head.innerHTML =
      `<span class="dot" style="background:${FAM_COLOR[fam]}"></span>` +
      `<span>${FAM_LABELS[fam]}</span>` +
      `<span class="cnt">· ${words.length}</span>`;
    group.appendChild(head);
    words.forEach(w => {
      const item = document.createElement('div');
      item.className = 'wl-item';

      const word = document.createElement('span');
      word.className = 'wl-w';
      word.textContent = w.headword;
      item.appendChild(word);

      if (w.phonetic) {
        const phonetic = document.createElement('span');
        phonetic.className = 'wl-ph';
        phonetic.textContent = `[${w.phonetic}]`;
        item.appendChild(phonetic);
      }

      const translation = document.createElement('span');
      translation.className = 'wl-tr';
      translation.textContent = (w.translation || '').split('\n')[0] || '(无释义)';
      translation.title = translation.textContent;
      item.appendChild(translation);

      const speak = document.createElement('button');
      speak.className = 'wl-speak';
      speak.type = 'button';
      speak.title = '朗读单词';
      speak.textContent = '🔊';
      speak.addEventListener('click', () => speakWord(w.headword));
      item.appendChild(speak);

      const stars = document.createElement('span');
      stars.className = 'wl-stars';
      [1,2,3,4,5].forEach(level => {
        const star = document.createElement('span');
        star.className = 'star' + (level <= fam ? ' on' : '');
        star.textContent = '★';
        star.title = `设置熟悉度为 ${level}`;
        star.addEventListener('click', () => setWordListStar(w.headword, level));
        stars.appendChild(star);
      });
      item.appendChild(stars);

      const master = document.createElement('button');
      master.className = 'wl-master';
      master.type = 'button';
      master.title = '标记为已掌握（移出学习流程）';
      master.textContent = '✓ 掌握';
      master.addEventListener('click', () => parkWordList(
        w.headword, '/api/mywords/master', '已掌握'
      ));
      item.appendChild(master);

      const ignore = document.createElement('button');
      ignore.className = 'wl-ignore';
      ignore.type = 'button';
      ignore.title = '忽略此词（人名 / 专有名词）';
      ignore.textContent = '🚫 忽略';
      ignore.addEventListener('click', () => parkWordList(
        w.headword, '/api/mywords/ignore', '已忽略'
      ));
      item.appendChild(ignore);
      group.appendChild(item);
    });
    body.appendChild(group);
  });
  if (!any) body.innerHTML = '<div class="wl-empty">这篇文章里没有可显示的单词。</div>';
}

function toggleWordListActions(checked) {
  document.getElementById('wordlist').classList.toggle('show-actions', checked);
}

async function setWordListStar(word, level) {
  if (!currentWordList) return;
  const entry = currentWordList.words.find(
    w => w.headword.toLowerCase() === word.toLowerCase()
  );
  if (!entry || entry.familiarity === level) return;
  try {
    const data = await postJSON('/api/familiarity', { word, level });
    entry.familiarity = data.familiarity;
    renderWordListBody();
    toast(`${word} → ${data.familiarity_label}`);
  } catch (e) { toast('保存失败'); }
}

async function parkWordList(word, url, tag) {
  if (!currentWordList) return;
  try {
    await postJSON(url, { word });
    currentWordList.words = currentWordList.words.filter(
      w => w.headword.toLowerCase() !== word.toLowerCase()
    );
    renderWordListBody();
    toast(`${word} · ${tag}`);
  } catch (e) { toast('保存失败'); }
}

function closeWordList() {
  panel.classList.remove('show');
  document.getElementById('wordlist').style.display = 'none';
  document.getElementById('wordlist').classList.remove('show-actions');
  document.getElementById('wlActionsSwitch').checked = false;
  document.getElementById('upload').style.display = 'block';
  currentWordList = null;
  window.scrollTo(0, 0);
}

const fileInput = document.getElementById('file');
fileInput.addEventListener('change', () => { if (fileInput.files[0]) upload(fileInput.files[0]); });

const drop = document.getElementById('drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor = ''; }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

async function upload(file) {
  const status = document.getElementById('status');
  status.textContent = '正在分析 ' + file.name + ' …';
  const fd = new FormData();
  fd.append('file', file);
  const range = readFamRange();
  fd.append('max_familiarity', String(range.max));
  fd.append('min_familiarity', String(range.min));
  try {
    const res = await fetch('/api/reading/prepare', { method:'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    showReader(data);
    loadLibrary();
  } catch (e) {
    status.textContent = '出错了：' + e.message;
  }
}

function showReader(data) {
  document.getElementById('upload').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  const range = readFamRange();
  readMinFam = range.min;
  readMaxFam = range.max;
  document.getElementById('fileName').textContent = data.name;
  document.getElementById('counts').textContent =
    `共 ${data.unique_words.toLocaleString()} 个不同单词 · ${data.highlighted.toLocaleString()} 个高亮生词`
    + (data.added ? ` · 新增 ${data.added.toLocaleString()} 个到「我的单词」` : '');
  document.getElementById('content').innerHTML = data.body;
  bindWords();
  currentBook = data.track_progress === false ? null : data.name;
  if (currentBook) {
    restoreReadingPosition(data.name, data.scroll);
  } else {
    window.scrollTo(0, 0);
  }
}

// Jump back to the last-read spot. Uses the scroll offset from the open/library
// response when available, otherwise asks the server for it.
async function restoreReadingPosition(name, knownScroll) {
  let savedY = parseInt(knownScroll, 10);
  if (!Number.isFinite(savedY)) {
    savedY = 0;
    try {
      const res = await fetch('/api/reading/progress?name=' + encodeURIComponent(name));
      if (res.ok) savedY = parseInt((await res.json()).scroll, 10) || 0;
    } catch (e) { savedY = 0; }
  }
  if (currentBook !== name) return;  // user moved on while we were fetching
  window.scrollTo(0, savedY);
  // Layout may still be settling (fonts, images); reapply once more.
  requestAnimationFrame(() => { if (currentBook === name) window.scrollTo(0, savedY); });
}

function bindWords() {
  document.querySelectorAll('#content .w').forEach(el => {
    el.addEventListener('click', () => openPanel(el));
  });
}

const panel = document.getElementById('panel');

function openPanel(el) {
  activeEl = el;
  refreshPanel();
  panel.classList.add('show');
}

function refreshPanel() {
  if (!activeEl) return;
  const fam = parseInt(activeEl.dataset.fam, 10);
  const excluded = activeEl.dataset.excluded === '1';
  panel.querySelector('.hw').textContent = activeEl.dataset.hw;
  panel.querySelector('.ph').textContent = activeEl.dataset.ph ? '[' + activeEl.dataset.ph + ']' : '';
  panel.querySelector('.tr').textContent = activeEl.dataset.tr;
  panel.querySelector('.fam').textContent = excluded
    ? '当前：已移出学习流程（忽略 / 掌握）'
    : '当前：' + (FAM_LABELS[fam] || fam);
  document.querySelectorAll('#stars .star').forEach(s => {
    s.classList.toggle('on', !excluded && parseInt(s.dataset.n, 10) <= fam);
  });
  document.getElementById('rankDown').disabled = !excluded && fam <= 1;
  document.getElementById('rankUp').disabled = !excluded && fam >= 5;
}

// Recolour / re-highlight every occurrence of a head word after a change.
function applyWordState(word, fam, excluded) {
  const key = word.toLowerCase();
  document.querySelectorAll('#content .w').forEach(el => {
    if (el.dataset.hw.toLowerCase() !== key) return;
    el.dataset.fam = String(fam);
    el.dataset.excluded = excluded ? '1' : '0';
    const inVocab = el.dataset.vocab === '1';
    const highlight = !excluded && fam >= readMinFam && fam <= readMaxFam;
    el.classList.toggle('hl', highlight);
    el.style.background = highlight
      ? (inVocab ? (FAM_COLOR[fam] || FAM_COLOR[1]) : UNKNOWN_COLOR)
      : '';
  });
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function speakWord(word) {
  if (!word || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function speakActive() {
  speakWord(activeEl && activeEl.dataset.hw);
}

async function copyText(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to legacy path */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

async function copyActive() {
  const word = activeEl && activeEl.dataset.hw;
  if (!word) return;
  const ok = await copyText(word);
  toast(ok ? `已复制 · ${word}` : '复制失败');
}

async function rankAdjust(delta) {
  if (!activeEl) return;
  const word = activeEl.dataset.hw;
  try {
    const data = await postJSON('/api/familiarity/adjust', { word, delta });
    applyWordState(word, data.familiarity, false);
    refreshPanel();
    toast(`${word} → ${data.familiarity_label}`);
  } catch (e) { toast('保存失败'); }
}

async function setStar(level) {
  if (!activeEl) return;
  const word = activeEl.dataset.hw;
  try {
    const data = await postJSON('/api/familiarity', { word, level });
    applyWordState(word, data.familiarity, false);
    refreshPanel();
    toast(`${word} → ${data.familiarity_label}`);
  } catch (e) { toast('保存失败'); }
}

async function parkWord(url, tag) {
  if (!activeEl) return;
  const word = activeEl.dataset.hw;
  try {
    await postJSON(url, { word });
    applyWordState(word, parseInt(activeEl.dataset.fam, 10), true);
    toast(`${word} · ${tag}`);
  } catch (e) { toast('保存失败'); return; }
  panel.classList.remove('show');
}

document.getElementById('speakBtn').addEventListener('click', speakActive);
panel.querySelector('.hw').addEventListener('click', copyActive);
document.getElementById('rankDown').addEventListener('click', () => rankAdjust(-1));
document.getElementById('rankUp').addEventListener('click', () => rankAdjust(1));
document.querySelectorAll('#stars .star').forEach(s => {
  s.addEventListener('click', () => setStar(parseInt(s.dataset.n, 10)));
});
document.getElementById('masterBtn').addEventListener('click', () => parkWord('/api/mywords/master', '已掌握'));
document.getElementById('ignoreBtn').addEventListener('click', () => parkWord('/api/mywords/ignore', '已忽略'));

document.addEventListener('click', e => {
  if (!e.target.closest('#content .w') && !e.target.closest('#panel')) panel.classList.remove('show');
});

function reset() {
  queueProgressSave();
  flushProgress(false);  // persist the current spot before leaving the reader
  document.getElementById('reader').style.display = 'none';
  document.getElementById('upload').style.display = 'block';
  document.getElementById('status').textContent = '';
  fileInput.value = '';
  currentBook = null;
  loadLibrary();  // refresh the percentage badges with the just-saved progress
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

loadLibrary();
const requestedWebPage = new URLSearchParams(window.location.search).get('url');
if (requestedWebPage) openWebPage(requestedWebPage);
</script>
</body>
</html>
