<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>单词射手 · Word Shooter</title>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--good:#22c55e;--bad:#ef4444;--gold:#fbbf24}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;display:flex;flex-direction:column} button,select{font:inherit}
    header{height:60px;padding:10px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--card2)} header a{color:var(--muted);font-size:24px;text-decoration:none} h1{font-size:18px;margin:0}.grow{flex:1}.stat{font-size:13px;color:var(--muted)}
    main{width:100%;max-width:980px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--card2);border-radius:22px;padding:24px}.hidden{display:none!important}
    .setup{text-align:center;max-width:800px;margin:auto}.setup h2,.summary h2{font-size:30px;margin:8px}.setup p{color:var(--muted);line-height:1.6}.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0}select{background:var(--bg);color:var(--text);border:1px solid var(--card2);border-radius:10px;padding:11px 14px}.primary{border:0;border-radius:12px;padding:12px 20px;background:var(--accent);color:#082f49;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.secondary{border:1px solid var(--card2);border-radius:12px;padding:11px 18px;background:transparent;color:var(--text);text-decoration:none;cursor:pointer}
    .generated{margin-top:24px;text-align:left}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.list-head h3{margin:0;font-size:17px}.word-list{border:1px solid var(--card2);border-radius:14px;max-height:430px;overflow:auto}.word-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card2)}.word-row:last-child{border-bottom:0}.word-row .en{min-width:110px;font-weight:700}.word-row .cn{flex:1;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stars{white-space:nowrap;font-size:19px;letter-spacing:1px}.star{color:#475569;cursor:pointer}.star.on{color:var(--gold)}.word-action{border:1px solid var(--card2);border-radius:8px;background:transparent;color:var(--text);padding:6px 8px;cursor:pointer}.master-btn:hover{color:var(--good);border-color:var(--good)}.ignore-btn:hover{color:var(--bad);border-color:var(--bad)}.start-row{margin:18px 0 0}
    .discover{text-align:center;max-width:620px;margin:auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:1px}.discover-word{font-size:clamp(34px,7vw,58px);font-weight:800;margin:20px 0 10px;word-break:break-word}.translation{font-size:clamp(20px,4vw,28px);line-height:1.45}.definition{color:var(--muted);font-size:15px;line-height:1.5;margin:18px auto;max-width:520px;white-space:pre-line}.dots{color:var(--muted);margin:20px}
    .question{text-align:center;margin:4px 0 12px}.question small{display:block;color:var(--muted);margin-bottom:6px}.question strong{font-size:clamp(15px,2.7vw,23px);line-height:1.35}.arena{position:relative;height:80vh;height:80dvh;min-height:520px;overflow:hidden;border:1px solid var(--card2);border-radius:20px;background:linear-gradient(#172554,#0c4a6e 65%,#164e63);isolation:isolate}.arena:after{content:"▲";position:absolute;bottom:8px;left:50%;font-size:42px;color:var(--accent);transform:translateX(-50%)}.arena.firing:after{color:#fff;filter:drop-shadow(0 0 10px var(--accent));transform:translateX(-50%) scale(1.18)}.danger-line{position:absolute;z-index:6;left:0;right:0;top:52px;border-top:2px dashed #fb7185;pointer-events:none;filter:drop-shadow(0 0 4px #ef4444)}.danger-line span{position:absolute;right:12px;top:5px;padding:3px 8px;border-radius:999px;background:#7f1d1dcc;color:#fecdd3;font-size:11px;font-weight:800;letter-spacing:.5px}
    .plane{position:absolute;bottom:-70px;width:max-content;min-height:42px;border:2px solid #64748b;border-radius:12px;background:#1e293bea;color:var(--text);font-weight:700;font-size:clamp(14px,2vw,18px);padding:7px 9px;cursor:crosshair;touch-action:manipulation;animation:rise var(--speed) linear infinite;animation-delay:var(--delay,0s);box-shadow:0 6px 16px #0005;white-space:nowrap}.plane:before{content:"✈  ";color:var(--accent);font-size:.9em}.word-flag{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:190px;padding:5px 8px;border-radius:7px;background:var(--gold);color:#422006;font-size:12px;font-weight:600;line-height:1.25;white-space:normal;box-shadow:0 3px 10px #0005}.word-flag:after{content:"";position:absolute;left:50%;bottom:100%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:var(--gold)}.plane.wrong{border-color:var(--bad);background:#7f1d1d;animation:shake .25s 2}.plane.target{z-index:3;width:min(300px,68vw);max-width:68vw;min-height:96px;border-color:var(--gold);background:#422006;animation:none;left:50%!important;bottom:50%;transform:translate(-50%,50%);font-size:clamp(18px,3.2vw,26px);white-space:normal}.correction-note{display:block;font-size:14px;color:#fde68a;margin-top:7px;font-weight:500}.plane.hit{animation:boom .35s forwards;background:var(--good);border-color:#86efac}
    @keyframes rise{from{transform:translate(-50%,0)}to{transform:translate(-50%,calc(-1 * var(--rise-distance)))}}@keyframes shake{from,to{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 10px))}}@keyframes boom{from{transform:translateX(-50%)}to{transform:translateX(-50%) scale(1.5);opacity:0}}
    .bullet{position:absolute;z-index:8;left:50%;bottom:48px;width:7px;height:18px;border-radius:999px;background:#fff7b2;box-shadow:0 0 6px #fff,0 0 14px var(--gold);pointer-events:none;transform:translate(-50%,50%);transition:transform .24s linear,opacity .24s ease-out}.bullet.fire{transform:translate(calc(-50% + var(--dx)),calc(50% + var(--dy))) scale(.7);opacity:.25}
    .reinforce{text-align:center;min-height:30px;margin:10px;color:#86efac;font-weight:700}.summary{text-align:center}.numbers{display:flex;justify-content:center;gap:30px;margin:28px;flex-wrap:wrap}.number b{display:block;font-size:32px;color:var(--accent)}.lists{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left;margin:20px auto;max-width:650px}.lists div{background:var(--bg);border-radius:14px;padding:16px}.lists h3{font-size:15px;margin:0 0 9px}.lists p{color:var(--muted);line-height:1.6;margin:0}.error{color:#fca5a5;text-align:center}
    .pause-bar{display:flex;justify-content:flex-end;margin-bottom:8px}.arena.paused .plane{animation-play-state:paused}.pause-panel{max-width:800px;margin:auto;text-align:center}.pause-panel .generated{display:block}
    @media(max-width:600px){header{gap:8px}.stat.hide-mobile{display:none}main{padding:10px}.panel{padding:16px}.arena{height:80vh;height:80dvh;min-height:480px}.plane{width:max-content;min-height:40px;padding:6px 7px;font-size:clamp(13px,3.6vw,16px)}.plane.target{width:min(300px,68vw);max-width:68vw}.lists{grid-template-columns:1fr}.word-row{flex-wrap:wrap}.word-row .en{min-width:90px}.word-row .cn{order:2;flex-basis:100%}.stars{margin-left:auto}}
    @media(prefers-reduced-motion:reduce){.plane{animation-duration:18s}}
  </style>
</head>
<body>
<header><a href="/" aria-label="返回">←</a><h1>✈️ 单词射手</h1><div class="grow"></div><span class="stat hide-mobile" id="progress"></span><span class="stat" id="score"></span><span class="stat" id="ammo"></span></header>
<main>
  <section class="panel setup" id="setup"><div class="eyebrow">WORD SHOOTER</div><h2>先准备，再出击</h2><p>选择范围并生成本局单词。开始前可以调整熟练度，或将不需要的词标记为掌握、忽略。</p><div class="row"><label>最低熟悉度 <select id="famMin"></select></label><label>最高熟悉度 <select id="famMax"></select></label><label>单词数 <select id="count"><option value="10">10</option><option value="50" selected>50</option><option value="endless">无限 Endless</option></select></label><button class="secondary" id="generate">生成列表</button></div><div class="generated hidden" id="generated"><div class="list-head"><h3>本局单词</h3><span class="stat" id="listCount"></span></div><div class="word-list" id="wordList"></div><div class="row start-row"><button class="primary" id="start">开始游戏</button></div></div><p class="error" id="error"></p></section>
  <section class="panel discover hidden" id="discover"><div class="eyebrow">发现 · DISCOVER</div><div class="discover-word" id="dword"></div><div class="translation" id="dtranslation"></div><div class="definition" id="ddefinition"></div><div class="dots" id="ddots"></div><button class="primary" id="continue">下一个</button></section>
  <section id="game" class="hidden"><div class="pause-bar"><button type="button" class="secondary" id="pause">⏸ 暂停</button></div><div class="question"><small>射击对应的英文单词</small><strong id="prompt"></strong></div><div class="arena" id="arena"><div class="danger-line"><span>危险线</span></div></div><div class="reinforce" id="reinforce"></div></section>
  <section class="panel pause-panel hidden" id="pausePanel"><div class="eyebrow">GAME PAUSED</div><h2>游戏已暂停</h2><p>可以调整本局单词；掌握或忽略的单词将从本局移除。</p><div class="generated"><div class="list-head"><h3>本局单词</h3><span class="stat" id="pauseListCount"></span></div><div class="word-list" id="pauseWordList"></div></div><p class="error" id="pauseError"></p><div class="row"><button class="primary" id="resume">继续游戏</button></div></section>
  <section class="panel summary hidden" id="summary"><div class="eyebrow">MISSION COMPLETE</div><h2>单词射手完成！</h2><div class="numbers"><div class="number"><b id="nwords"></b>练习单词</div><div class="number"><b id="ncorrect"></b>正确射击</div><div class="number"><b id="nwrong"></b>学习纠错</div></div><div class="lists"><div><h3>记得很好</h3><p id="well"></p></div><div><h3>需要练习</h3><p id="practice"></p></div></div><div class="row"><button class="primary" onclick="location.reload()">再玩一次</button><a class="secondary" href="/cards">返回单词学习</a></div></section>
</main>
<script src="/static/word-shooter.js"></script>
</body></html>
