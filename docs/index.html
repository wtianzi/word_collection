  <style>
    :root { color-scheme: light; }

      border-radius: 14px;
      background: #fff;
      color: inherit;
      text-decoration: none;

      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .book:hover {
      border-color: #0284c7;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(15, 23, 42, .1);
    }
    .range { font-size: 19px; font-weight: 700; }
    .sub { margin-top: 4px; color: #64748b; font-size: 14px; }
